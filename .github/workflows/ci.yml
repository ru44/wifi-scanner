name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: wifi-scanner-linux-x86_64
          - os: windows-latest
            asset: wifi-scanner-windows-x86_64.exe
          - os: macos-latest
            asset: wifi-scanner-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: cp target/release/wifi-scanner "${{ matrix.asset }}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: cp target/release/wifi-scanner.exe "${{ matrix.asset }}"
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          scripts/bundle-macos.sh
          plutil -lint target/WifiScanner.app/Contents/Info.plist
          codesign --verify --verbose target/WifiScanner.app
          ditto -c -k --keepParent target/WifiScanner.app "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
